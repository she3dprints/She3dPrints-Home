
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Name Keychains | She3DPrints</title>

<style>
:root {
  --milk:#FBF7F4;
  --oat:#E8DED5;
  --brown:#684332;
  --dark:#30251F;
}
* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--milk);
  color:var(--dark);
  font-family:Arial,sans-serif;
}
header {
  padding:22px 16px;
  text-align:center;
  border-bottom:1px solid var(--oat);
}
header h1 {
  margin:0;
  font-size:25px;
  color:var(--brown);
}
header p {
  margin:7px 0 0;
  font-size:13px;
}
.container {
  max-width:1050px;
  margin:auto;
  padding:20px 15px 40px;
}
.layout {
  display:grid;
  grid-template-columns:1.15fr 0.85fr;
  gap:25px;
}
.preview-box {
  background:white;
  border:1px solid var(--oat);
  border-radius:16px;
  overflow:hidden;
}
#preview {
  width:100%;
  height:420px;
  display:block;
  touch-action:pan-y;
}
.preview-note {
  text-align:center;
  font-size:12px;
  color:#82756D;
  padding:0 10px 15px;
}
.panel {
  background:white;
  border:1px solid var(--oat);
  border-radius:16px;
  padding:22px;
}
h2 {
  font-size:20px;
  margin:0 0 20px;
  color:var(--brown);
}
.field { margin-bottom:20px; }
label {
  display:block;
  font-size:14px;
  font-weight:bold;
  margin-bottom:9px;
}
input[type="text"], select {
  width:100%;
  padding:13px;
  border:1px solid #D9CBC1;
  border-radius:9px;
  font-size:16px;
  background:white;
  color:var(--dark);
}
.colors {
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}
.swatch {
  width:34px;
  height:34px;
  border-radius:50%;
  border:2px solid #ddd;
  cursor:pointer;
  position:relative;
  padding:0;
}
.swatch.selected {
  outline:2px solid var(--brown);
  outline-offset:3px;
}
.swatch.white {
  border:1px solid #aaa;
}
.price {
  background:var(--milk);
  padding:15px;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:18px 0;
}
.price strong {
  font-size:22px;
  color:var(--brown);
}
.order-button {
  border:0;
  border-radius:10px;
  padding:15px;
  width:100%;
  background:var(--brown);
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}
.order-button:disabled {
  opacity:.5;
  cursor:not-allowed;
}
.small {
  font-size:12px;
  color:#82756D;
  line-height:1.5;
}
.loading {
  text-align:center;
  padding:12px;
  font-size:13px;
  color:var(--brown);
}
@media(max-width:760px) {
  .layout { grid-template-columns:1fr; }
  #preview { height:340px; }
  .panel { padding:18px; }
}
</style>
</head>

<body>

<header>
  <h1>She3DPrints</h1>
  <p>Custom Name Keychains</p>
</header>

<div class="container">
  <div class="layout">

    <div class="preview-box">
      <div id="preview"></div>
      <div class="preview-note">
        Drag to rotate · Pinch to zoom
      </div>
      <div class="loading" id="loading">Preparing 3D preview...</div>
    </div>

    <div class="panel">
      <h2>Customise Your Keychain</h2>

      <div class="field">
        <label for="customerName">Your Name</label>
        <input
          type="text"
          id="customerName"
          maxlength="18"
          value="Ayesha"
          placeholder="Type your name"
          autocomplete="off"
        >
      </div>

      <div class="field">
        <label>Base Colour</label>
        <div class="colors" id="baseColors"></div>
      </div>

      <div class="field">
        <label>Name Colour</label>
        <div class="colors" id="nameColors"></div>
      </div>

      <div class="field">
        <label for="attachment">Keyring Position</label>
        <select id="attachment">
          <option value="top-left">Top</option>
          <option value="left">Side</option>
        </select>
      </div>

      <div class="price">
        <span>Keychain Price</span>
        <strong id="price">Rs. 350</strong>
      </div>

      <p class="small">
        1–5 letters: Rs.350<br>
        6–8 letters: Rs.450<br>
        9 or more letters: Rs.550
      </p>

      <button class="order-button" id="orderButton" disabled>
        Order via WhatsApp
      </button>

      <p class="small" style="text-align:center;margin-top:13px">
        Your personalised name will be used to create your keychain.
      </p>
    </div>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/clipper.js"></script>

<script>
const COLORS = [
  {name:"Light Pink",hex:"#E7A1B5"},
  {name:"Dark Green",hex:"#174C38"},
  {name:"Matcha Green",hex:"#A8B98A"},
  {name:"Black",hex:"#222222"},
  {name:"White",hex:"#FFFFFF"},
  {name:"Brown",hex:"#684332"}
];

let baseColor = COLORS[0];
let nameColor = COLORS[3];

let font = null;
let scene, camera, renderer, controls;
let baseMesh = null;
let nameMesh = null;

const preview = document.getElementById("preview");
const loading = document.getElementById("loading");
const nameInput = document.getElementById("customerName");
const attachment = document.getElementById("attachment");
const orderButton = document.getElementById("orderButton");

const SCALE = 1000;
const BASE_THICKNESS = 3;
const NAME_HEIGHT = 2;
const BASE_OFFSET = 3.5;

function makeSwatches(containerId, selected, callback) {
  const container = document.getElementById(containerId);

  COLORS.forEach(color => {
    const swatch = document.createElement("button");
    swatch.type = "button";
    swatch.className = "swatch" +
      (color.hex === "#FFFFFF" ? " white" : "") +
      (color === selected ? " selected" : "");

    swatch.style.background = color.hex;
    swatch.title = color.name;
    swatch.setAttribute("aria-label", color.name);

    swatch.addEventListener("click", () => {
      container.querySelectorAll(".swatch").forEach(s =>
        s.classList.remove("selected")
      );
      swatch.classList.add("selected");
      callback(color);
    });

    container.appendChild(swatch);
  });
}

makeSwatches("baseColors", baseColor, color => {
  baseColor = color;
  updateMaterials();
});

makeSwatches("nameColors", nameColor, color => {
  nameColor = color;
  updateMaterials();
});

function initThree() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color("#FFFFFF");

  camera = new THREE.PerspectiveCamera(
    38,
    preview.clientWidth / preview.clientHeight,
    0.1,
    1000
  );

  camera.position.set(0, -95, 105);

  renderer = new THREE.WebGLRenderer({
    antialias:true,
    alpha:false
  });

  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(preview.clientWidth, preview.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  preview.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.minDistance = 45;
  controls.maxDistance = 180;

  scene.add(new THREE.AmbientLight(0xffffff, 0.8));

  const light = new THREE.DirectionalLight(0xffffff, 1.1);
  light.position.set(-35, 45, 90);
  scene.add(light);

  const secondLight = new THREE.DirectionalLight(0xffffff, 0.45);
  secondLight.position.set(45, -35, 40);
  scene.add(secondLight);

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

function resizePreview() {
  if (!renderer) return;

  const width = preview.clientWidth;
  const height = preview.clientHeight;

  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
}

window.addEventListener("resize", resizePreview);

function getContours(text) {
  const path = font.getPath(text, 0, 0, 100);
  const commands = path.commands;
  const contours = [];

  let points = [];
  let current = {x:0,y:0};
  let start = {x:0,y:0};

  function addPoint(x,y) {
    points.push({
      X:Math.round(x*SCALE),
      Y:Math.round(-y*SCALE)
    });
  }

  function finishContour() {
    if (points.length >= 3) contours.push(points);
    points = [];
  }

  function quadratic(p0,p1,p2,t) {
    const mt = 1-t;
    return {
      x:mt*mt*p0.x+2*mt*t*p1.x+t*t*p2.x,
      y:mt*mt*p0.y+2*mt*t*p1.y+t*t*p2.y
    };
  }

  function cubic(p0,p1,p2,p3,t) {
    const mt = 1-t;
    return {
      x:mt*mt*mt*p0.x+
         3*mt*mt*t*p1.x+
         3*mt*t*t*p2.x+
         t*t*t*p3.x,
      y:mt*mt*mt*p0.y+
         3*mt*mt*t*p1.y+
         3*mt*t*t*p2.y+
         t*t*t*p3.y
    };
  }

  commands.forEach(cmd => {
    if (cmd.type === "M") {
      finishContour();
      current = {x:cmd.x,y:cmd.y};
      start = {...current};
      addPoint(current.x,current.y);
    }
    else if (cmd.type === "L") {
      current = {x:cmd.x,y:cmd.y};
      addPoint(current.x,current.y);
    }
    else if (cmd.type === "Q") {
      const p0 = {...current};
      const p1 = {x:cmd.x1,y:cmd.y1};
      const p2 = {x:cmd.x,y:cmd.y};

      for (let i=1;i<=10;i++) {
        const p = quadratic(p0,p1,p2,i/10);
        addPoint(p.x,p.y);
      }
      current = p2;
    }
    else if (cmd.type === "C") {
      const p0 = {...current};
      const p1 = {x:cmd.x1,y:cmd.y1};
      const p2 = {x:cmd.x2,y:cmd.y2};
      const p3 = {x:cmd.x,y:cmd.y};

      for (let i=1;i<=12;i++) {
        const p = cubic(p0,p1,p2,p3,i/12);
        addPoint(p.x,p.y);
      }
      current = p3;
    }
    else if (cmd.type === "Z") {
      addPoint(start.x,start.y);
      finishContour();
      current = {...start};
    }
  });

  finishContour();
  return contours;
}

function boundsOf(paths) {
  let minX=Infinity, maxX=-Infinity;
  let minY=Infinity, maxY=-Infinity;

  paths.forEach(path => path.forEach(p => {
    minX=Math.min(minX,p.X);
    maxX=Math.max(maxX,p.X);
    minY=Math.min(minY,p.Y);
    maxY=Math.max(maxY,p.Y);
  }));

  return {minX,maxX,minY,maxY};
}

function scalePaths(paths, targetWidth) {
  const b = boundsOf(paths);
  const width = b.maxX-b.minX;
  const height = b.maxY-b.minY;

  if (!width || !height) throw new Error("Invalid name outline");

  const factor = targetWidth*SCALE/width;

  return paths.map(path => path.map(p => ({
    X:Math.round((p.X-(b.minX+b.maxX)/2)*factor),
    Y:Math.round((p.Y-(b.minY+b.maxY)/2)*factor)
  })));
}

function clipperUnion(paths) {
  const clipper = new ClipperLib.Clipper();

  clipper.AddPaths(
    paths,
    ClipperLib.PolyType.ptSubject,
    true
  );

  const result = new ClipperLib.Paths();

  clipper.Execute(
    ClipperLib.ClipType.ctUnion,
    result,
    ClipperLib.PolyFillType.pftNonZero,
    ClipperLib.PolyFillType.pftNonZero
  );

  return result;
}

function offsetPaths(paths, amount) {
  const offset = new ClipperLib.ClipperOffset(2, 0.25*SCALE);

  offset.AddPaths(
    paths,
    ClipperLib.JoinType.jtRound,
    ClipperLib.EndType.etClosedPolygon
  );

  const result = new ClipperLib.Paths();
  offset.Execute(result, amount*SCALE);

  return result;
}

function circlePath(cx,cy,radius,steps=48) {
  const path = [];

  for (let i=0;i<steps;i++) {
    const a = Math.PI*2*i/steps;
    path.push({
      X:Math.round((cx+Math.cos(a)*radius)*SCALE),
      Y:Math.round((cy+Math.sin(a)*radius)*SCALE)
    });
  }

  return path;
}

function makeBasePaths(letterPaths, position) {
  const expanded = offsetPaths(
    clipperUnion(letterPaths),
    BASE_OFFSET
  );

  const b = boundsOf(expanded);

  let tabX, tabY;

  if (position === "top-left") {
    tabX = b.minX/SCALE + 5;
    tabY = b.maxY/SCALE + 3;
  } else {
    tabX = b.minX/SCALE + 1;
    tabY = (b.minY+b.maxY)/(2*SCALE);
  }

  const tab = circlePath(tabX,tabY,7.5);
  const combined = clipperUnion([...expanded,tab]);
  const hole = circlePath(tabX,tabY,3.1);

  const difference = new ClipperLib.Clipper();

  difference.AddPaths(
    combined,
    ClipperLib.PolyType.ptSubject,
    true
  );

  difference.AddPath(
    hole,
    ClipperLib.PolyType.ptClip,
    true
  );

  const finalPaths = new ClipperLib.Paths();

  difference.Execute(
    ClipperLib.ClipType.ctDifference,
    finalPaths,
    ClipperLib.PolyFillType.pftNonZero,
    ClipperLib.PolyFillType.pftNonZero
  );

  return finalPaths;
}

function pointInside(point, polygon) {
  let inside = false;

  for (let i=0,j=polygon.length-1;i<polygon.length;j=i++) {
    const a = polygon[i];
    const b = polygon[j];

    const crosses =
      ((a.Y>point.Y)!==(b.Y>point.Y)) &&
      (point.X < (b.X-a.X)*(point.Y-a.Y)/(b.Y-a.Y)+a.X);

    if (crosses) inside = !inside;
  }

  return inside;
}

function pathToShape(path) {
  const shape = new THREE.Shape();

  path.forEach((p,i) => {
    const x=p.X/SCALE;
    const y=p.Y/SCALE;

    if (i===0) shape.moveTo(x,y);
    else shape.lineTo(x,y);
  });

  shape.closePath();
  return shape;
}

function pathsToShapes(paths) {
  const outers = [];
  const holes = [];

  paths.forEach(path => {
    if (ClipperLib.Clipper.Orientation(path)) {
      outers.push(path);
    } else {
      holes.push(path);
    }
  });

  const shapes = outers.map(path => pathToShape(path));

  holes.forEach(hole => {
    const testPoint = hole[0];

    for (let i=0;i<outers.length;i++) {
      if (pointInside(testPoint,outers[i])) {
        const holePath = new THREE.Path();

        hole.forEach((p,j) => {
          const x=p.X/SCALE;
          const y=p.Y/SCALE;

          if (j===0) holePath.moveTo(x,y);
          else holePath.lineTo(x,y);
        });

        holePath.closePath();
        shapes[i].holes.push(holePath);
        break;
      }
    }
  });

  return shapes;
}

function makeExtrudedMesh(paths, depth, material, zPosition) {
  const shapes = pathsToShapes(paths);

  const geometry = new THREE.ExtrudeGeometry(shapes,{
    depth:depth,
    bevelEnabled:false,
    curveSegments:8,
    steps:1
  });

  geometry.computeVertexNormals();

  const mesh = new THREE.Mesh(geometry,material);
  mesh.position.z = zPosition;
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  return mesh;
}

function removeOldModel() {
  [baseMesh,nameMesh].forEach(mesh => {
    if (mesh) {
      scene.remove(mesh);
      mesh.geometry.dispose();
      mesh.material.dispose();
    }
  });

  baseMesh = null;
  nameMesh = null;
}

let rebuildTimer = null;

function scheduleRebuild() {
  clearTimeout(rebuildTimer);
  rebuildTimer = setTimeout(rebuildKeychain,180);
}

function rebuildKeychain() {
  if (!font || !scene) return;

  const raw = nameInput.value.trim();

  if (!raw) {
    removeOldModel();
    return;
  }

  try {
    removeOldModel();

    let letterPaths = getContours(raw);

    if (!letterPaths.length) return;

    letterPaths = scalePaths(letterPaths,76);

    const basePaths = makeBasePaths(
      letterPaths,
      attachment.value
    );

    const baseMaterial = new THREE.MeshStandardMaterial({
      color:baseColor.hex,
      roughness:0.68,
      metalness:0.02
    });

    const nameMaterial = new THREE.MeshStandardMaterial({
      color:nameColor.hex,
      roughness:0.58,
      metalness:0.02
    });

    baseMesh = makeExtrudedMesh(
      basePaths,
      BASE_THICKNESS,
      baseMaterial,
      0
    );

    nameMesh = makeExtrudedMesh(
      letterPaths,
      NAME_HEIGHT,
      nameMaterial,
      BASE_THICKNESS
    );

    scene.add(baseMesh);
    scene.add(nameMesh);

    const box = new THREE.Box3().setFromObject(baseMesh);
    const center = box.getCenter(new THREE.Vector3());

    baseMesh.position.x -= center.x;
    baseMesh.position.y -= center.y;

    nameMesh.position.x -= center.x;
    nameMesh.position.y -= center.y;

    camera.position.set(0,-95,105);
    controls.target.set(0,0,1);
    controls.update();

    loading.style.display="none";

  } catch(error) {
    console.error(error);
    loading.textContent =
      "Could not create this name. Please try another spelling.";
    loading.style.display="block";
  }

  updatePrice();
}

function updateMaterials() {
  if (baseMesh) baseMesh.material.color.set(baseColor.hex);
  if (nameMesh) nameMesh.material.color.set(nameColor.hex);
}

function updatePrice() {
  const letters = nameInput.value.trim().replace(/\s/g,"").length;

  let price = 350;

  if (letters >= 6 && letters <= 8) price = 450;
  if (letters >= 9) price = 550;

  document.getElementById("price").textContent =
    "Rs. " + price;
}

nameInput.addEventListener("input",() => {
  updatePrice();
  scheduleRebuild();
});

attachment.addEventListener("change",scheduleRebuild);

orderButton.addEventListener("click",() => {
  const name = nameInput.value.trim();
  const letters = name.replace(/\s/g,"").length;

  if (!name || !letters) {
    alert("Please enter your name first.");
    return;
  }

  let price = 350;
  if (letters >= 6 && letters <= 8) price = 450;
  if (letters >= 9) price = 550;

  const position = attachment.value === "top-left"
    ? "Top"
    : "Side";

  const message =
`Hello She3DPrints! I would like to order a custom name keychain.

Name: ${name}
Base colour: ${baseColor.name}
Name colour: ${nameColor.name}
Keyring position: ${position}
Price: Rs. ${price}

Thank you!`;

  const phoneNumber = "947XXXXXXXX";

  window.open(
    "https://wa.me/" + phoneNumber +
    "?text=" + encodeURIComponent(message),
    "_blank"
  );
});

async function start() {
  try {
    initThree();

    font = await new Promise((resolve,reject) => {
      opentype.load(
        "https://cdn.jsdelivr.net/gh/google/fonts@main/apache/satisfy/Satisfy-Regular.ttf",
        (error,loadedFont) => {
          if (error) reject(error);
          else resolve(loadedFont);
        }
      );
    });

    orderButton.disabled = false;
    rebuildKeychain();

  } catch(error) {
    console.error("3D preview error:",error);
    loading.textContent =
      "The 3D preview could not load. Please try again later.";
    loading.style.display="block";
  }
}

start();
</script>

</body>
</html>
